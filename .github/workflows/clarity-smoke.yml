name: Clarity Smoke (dispatch 전용 — 토큰·놀쿨 분리 1콜 확인, 메일 0)

# ★임시 브랜치 전용 오버라이드: 월간 성장 사이클 갭 계열 읽기 덤프 (main의 이 파일은 무변경)
on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Gap dump (read-only)
        run: node scripts/monthly-growth-gap-dump.mjs
        env:
          GSC_SA_JSON: ${{ secrets.GSC_SA_JSON }}
