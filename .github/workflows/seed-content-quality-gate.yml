name: Seed Content Quality Gate (weekly)

# 커뮤니티 시드 풀 "발행 전 검문소" — auto-content-v2 가 발행하는 seed_post_pool 을 주1회 전수 검사.
#   🚫 금지어(가격/2차 등) = 하드 FAIL
#   🎣 후킹 5축 미달 / ♻️ 양산 지문(n-gram 재탕) = 경고 메일
# 라이브 풀을 읽기 전용 SELECT 로 검사(쓰기 0, 사이트 크롤 0, 부하 0). 이슈 있을 때만 메일.
on:
  schedule:
    # 매주 월 KST 11:45 (UTC 02:45) — 11:30 GSC 성장기회와 분리
    - cron: '45 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write # 30일1통: 인박스 커밋 필요

jobs:
  seed-quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Seed pool quality gate
        run: node scripts/seed-content-quality-gate.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}

      # 30일 1통 정책(2026-08-17): 즉시 발송 대신 축적된 월간 인박스를 저장 — 매월 30일 지휘자 보고서가 소비
      - name: Archive monthly inbox (30일 1통 정책)
        if: always()
        run: |
          if [ -n "$(git status --porcelain data/monthly-inbox)" ]; then
            git config user.name "nolcool-bot"
            git config user.email "bot@nolcool.com"
            git add data/monthly-inbox
            git commit -m "chore(mail): monthly-inbox 축적 $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash origin main || true
            git push || echo "push skip(경쟁 커밋) — 다음 실행 재시도"
          else
            echo "인박스 변화 없음 — 커밋 skip"
          fi
