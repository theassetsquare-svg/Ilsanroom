name: Google Index Coverage (전수 색인 점검)

on:
  schedule:
    # 매주 월 KST 09:00 (UTC 00:00) — 전수 검사라 일일 아님(쿼터·중복 크롤 방지)
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      nudge:
        description: '색인 안 된 URL Indexing API publish (회색지대)'
        type: boolean
        default: false

permissions:
  contents: write # 30일1통: 인박스 커밋 필요

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inspect all sitemap URLs + report non-indexed
        run: node scripts/google-index-coverage.mjs ${{ (github.event_name == 'workflow_dispatch' && inputs.nudge) && '--nudge-indexing-api' || '' }}
        env:
          GSC_SA_JSON: ${{ secrets.GSC_SA_JSON }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}

      # 30일 1통 정책(2026-08-17): 즉시 발송 대신 축적된 월간 인박스를 저장 — 매월 30일 지휘자 보고서가 소비
      - name: Archive monthly inbox (30일 1통 정책)
        if: always()
        run: |
          if [ -n "$(git status --porcelain data/monthly-inbox)" ]; then
            git config user.name "nolcool-bot"
            git config user.email "bot@nolcool.com"
            git add data/monthly-inbox
            git commit -m "chore(mail): monthly-inbox 축적 $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash origin main || true
            git push || echo "push skip(경쟁 커밋) — 다음 실행 재시도"
          else
            echo "인박스 변화 없음 — 커밋 skip"
          fi
