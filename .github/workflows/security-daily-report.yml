name: Security Daily Report

# 매일 KST 09:00 (UTC 00:00) — Supabase 보안 5지표 "정상/회귀" 상태 메일
# 회귀 시만 보내는 hourly/nightly 와 달리, 매일 1통 발송 (사장님 안심용)
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write # 30일1통: 인박스 커밋 필요

jobs:
  daily-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Send daily security status mail
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
        run: node scripts/security-daily-report.mjs

      # 30일 1통 정책(2026-08-17): 즉시 발송 대신 축적된 월간 인박스를 저장 — 매월 30일 지휘자 보고서가 소비
      - name: Archive monthly inbox (30일 1통 정책)
        if: always()
        run: |
          if [ -n "$(git status --porcelain data/monthly-inbox)" ]; then
            git config user.name "nolcool-bot"
            git config user.email "bot@nolcool.com"
            git add data/monthly-inbox
            git commit -m "chore(mail): monthly-inbox 축적 $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash origin main || true
            git push || echo "push skip(경쟁 커밋) — 다음 실행 재시도"
          else
            echo "인박스 변화 없음 — 커밋 skip"
          fi
