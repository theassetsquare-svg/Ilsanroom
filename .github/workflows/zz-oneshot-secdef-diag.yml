name: zz-oneshot-secdef-diag

# 일회용 진단 (reference_local_db_via_oneshot_workflow 패턴)
# SECURITY DEFINER + PUBLIC EXECUTE 함수 전수 특정 후 이 파일은 삭제됨.
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: List SECDEF+PUBLIC functions
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          cat > /tmp/diag.mjs <<'EOF'
          const URL_ = process.env.SUPABASE_URL;
          const KEY = process.env.SUPABASE_SERVICE_KEY;
          const headers = { apikey: KEY, Authorization: `Bearer ${KEY}`, 'Content-Type': 'application/json' };
          async function execSql(query) {
            const res = await fetch(`${URL_}/rest/v1/rpc/exec_sql`, { method: 'POST', headers, body: JSON.stringify({ query }) });
            const t = await res.text(); let j; try { j = JSON.parse(t); } catch { j = { raw: t }; }
            if (!res.ok || j?.success === false) throw new Error(j?.error || t);
            return j;
          }
          await execSql(`
            DROP TABLE IF EXISTS public._diag_secdef_list;
            CREATE TABLE public._diag_secdef_list (fn text, args text, acl text, lang text, owner text, src_head text);
            INSERT INTO public._diag_secdef_list
              SELECT p.proname, pg_get_function_identity_arguments(p.oid), p.proacl::text,
                     l.lanname, r.rolname, left(p.prosrc, 120)
              FROM pg_proc p
              JOIN pg_namespace n ON n.oid=p.pronamespace
              JOIN pg_language l ON l.oid=p.prolang
              JOIN pg_roles r ON r.oid=p.proowner
              WHERE n.nspname='public' AND p.prokind='f' AND p.prosecdef=true
                AND EXISTS (SELECT 1 FROM aclexplode(p.proacl) a WHERE a.grantee=0);
            NOTIFY pgrst, 'reload schema';
          `);
          await new Promise(r => setTimeout(r, 2500));
          let rows = [];
          for (let i = 0; i < 5; i++) {
            const res = await fetch(`${URL_}/rest/v1/_diag_secdef_list?select=*`, { headers });
            if (res.ok) { rows = await res.json(); break; }
            await new Promise(r => setTimeout(r, 2000));
          }
          console.log('=== SECDEF+PUBLIC EXECUTE 함수 목록 ===');
          console.log(JSON.stringify(rows, null, 2));
          await execSql(`DROP TABLE IF EXISTS public._diag_secdef_list;`);
          EOF
          node /tmp/diag.mjs
