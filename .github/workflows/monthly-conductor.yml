name: Monthly Conductor (월간 무인 지휘자 — 수집·진단·안전수정·보고)

# 매월 말일 KST 10:50 = UTC 01:50 (대표님 2026-09-27 05:20 「매달 말일」 · 옛 「매월 30일(2월 28일)」 대체).
# KST 28~31일 10:50 에 뜨고 첫 단계 말일 가드가 말일이 아니면 끝낸다. monthly-full-audit(말일 KST 07:13) 이후 슬롯 → 그 산출을 소비.
# 무충돌: UTC '50 1 28,29,30,31 * *' — UTC 1시대 분(0/5/10/15/20/25/30/35/40/45) 전부 회피(50 미사용), dom-지정 크론은 billing 1일·full-audit 27~30일 22시뿐 → 겹침 0.
on:
  schedule:
    - cron: '50 1 28,29,30,31 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '드라이런(수정 0·발송 0)'
        type: boolean
        default: false

# data/growth 가설·중복방지 플래그 커밋을 위해 write.
permissions:
  contents: write

jobs:
  conductor:
    runs-on: ubuntu-latest
    steps:
      # 말일 가드 — KST 로 내일이 1일일 때만(= 오늘이 말일) 진행 · 수동 실행은 날짜와 상관없이 진행 · GUARD_TODAY 는 날짜 흉내 시험용(비워 둔다)
      - name: 말일 가드 (KST 내일이 1일이 아니면 종료)
        id: guard
        env:
          EVENT: ${{ github.event_name }}
          GUARD_TODAY: ''
        run: |
          TODAY="${GUARD_TODAY:-$(TZ=Asia/Seoul date +%F)}"
          NEXT="$(date -d "$TODAY +1 day" +%d)"
          if [ "$EVENT" = "workflow_dispatch" ] || [ "$NEXT" = "01" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "진행: $TODAY (KST · 내일 ${NEXT}일 · $EVENT)"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "말일 아님 — 종료: $TODAY (KST · 내일 ${NEXT}일)"
          fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.run == 'true'
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.run == 'true'
        with:
          node-version: 20
      - name: Run monthly conductor
        if: steps.guard.outputs.run == 'true'
        run: node scripts/monthly-conductor.mjs ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
        env:
          GSC_SA_JSON: ${{ secrets.GSC_SA_JSON }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          CLARITY_API_TOKEN: ${{ secrets.CLARITY_API_TOKEN }}
          CLARITY_PROJECT_ID: ${{ secrets.CLARITY_PROJECT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
      - name: Persist hypotheses / sent-flag
        if: always() && steps.guard.outputs.run == 'true'
        run: |
          if [ -n "$(git status --porcelain data/growth)" ]; then
            git config user.name "nolcool-bot"
            git config user.email "bot@nolcool.com"
            git add data/growth
            git commit -m "chore(conductor): 월간 가설·플래그 $(date -u +%Y-%m)"
            git pull --rebase --autostash origin main || true
            git push || echo "push skip(경쟁 커밋) — 다음 달 재시도"
          fi
