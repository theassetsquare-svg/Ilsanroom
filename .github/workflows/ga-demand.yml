name: GA4 Demand Insight (weekly)

# 주 1회 사용자가 *원하는* 페이지를 GA4에서 발견 → 운영자가 그 페이지/콘텐츠를 더 만든다.
# (불만족 적발은 ga-health.yml, 본 워크플로는 수요/사랑/성장 = 긍정 신호)
on:
  schedule:
    # 매주 월 KST 11:00 (UTC 02:00) — 월요일 09:30 랭킹/09:45 하락대응과 시간 분리
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write # 30일1통: 인박스 커밋 필요

jobs:
  ga-demand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: GA4 demand insight
        run: node scripts/ga-demand-insight.mjs
        env:
          GSC_SA_JSON: ${{ secrets.GSC_SA_JSON }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}

      # 30일 1통 정책(2026-08-17): 즉시 발송 대신 축적된 월간 인박스를 저장 — 매월 30일 지휘자 보고서가 소비
      - name: Archive monthly inbox (30일 1통 정책)
        if: always()
        run: |
          if [ -n "$(git status --porcelain data/monthly-inbox)" ]; then
            git config user.name "nolcool-bot"
            git config user.email "bot@nolcool.com"
            git add data/monthly-inbox
            git commit -m "chore(mail): monthly-inbox 축적 $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash origin main || true
            git push || echo "push skip(경쟁 커밋) — 다음 실행 재시도"
          else
            echo "인박스 변화 없음 — 커밋 skip"
          fi
