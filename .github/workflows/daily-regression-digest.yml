name: Daily Regression Digest (KST 09:00)

on:
  schedule:
    # 매일 KST 09:00 (UTC 00:00) — Actions 24h 회귀 다이제스트 1통
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Daily regression digest
        run: node scripts/daily-regression-digest.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}

      - name: Commit snapshot for /admin/audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain public/admin/actions-digest.json)" ]; then
            git add public/admin/actions-digest.json
            git commit -m "chore(admin): actions-digest 24h snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          else
            echo "no snapshot diff"
          fi

      # 30일 1통 정책(2026-08-17): 즉시 발송 대신 축적된 월간 인박스를 저장 — 매월 30일 지휘자 보고서가 소비
      - name: Archive monthly inbox (30일 1통 정책)
        if: always()
        run: |
          if [ -n "$(git status --porcelain data/monthly-inbox)" ]; then
            git config user.name "nolcool-bot"
            git config user.email "bot@nolcool.com"
            git add data/monthly-inbox
            git commit -m "chore(mail): monthly-inbox 축적 $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash origin main || true
            git push || echo "push skip(경쟁 커밋) — 다음 실행 재시도"
          else
            echo "인박스 변화 없음 — 커밋 skip"
          fi
