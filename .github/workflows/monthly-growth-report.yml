name: Monthly Growth Cycle Report (manual)

# 월간 성장 사이클(매달 1일 수동) 마감 리포트 메일 1통.
# 수동 실행 전용(workflow_dispatch). 읽기전용 — 사이트/데이터 변경 0.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Email monthly growth report
        run: node scripts/send-monthly-growth-report.mjs
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
